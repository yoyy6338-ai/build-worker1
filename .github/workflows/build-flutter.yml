

name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Job ID from Bot"
        required: true
        type: string
      userId:
        description: "User ID"
        required: true
        type: string
      payload:
        description: "Build Payload JSON"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Inputs
        run: |
          echo "Job ID: ${{ inputs.jobId }}"
          echo "User ID: ${{ inputs.userId }}"
          echo '${{ inputs.payload }}'
